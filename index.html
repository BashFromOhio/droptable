<title>Drop Table Learn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Drop Table: a free course in SQL, Python, data and AI, told through the story of Big Face at an Atlanta sneaker shop. By Ofgeneration LLC.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a sneaker-shop counter. A night-black release banner up top, shoebox-label cards on the release wall, then Young Michael's shifts; SQL work happens on a dark "register" screen. */
:root {
  /* Night-city brand from the book cover: Atlanta after dark, neon orange, sign yellow, graffiti purple. */
  --bg: #120A24; --panel: #1D1236; --ink: #F7F1FF; --muted: #B8A9D4; --line: #3B2B60;
  --kraft: #C4925E; --kraft-soft: #2B1C46; --kraft-ink: #F3DFC4;
  --tag: #F4560C; --tag-ink: #FFFFFF; --sticker: #F9D306; --purple: #A538F2;
  --ok: #4CD98E; --ok-soft: #133024; --bad: #FF6070; --bad-soft: #3A1420;
  --term: #0A0616; --term-ink: #ECE6F7; --term-dim: #8C80A8; --term-line: #2A1F45;
  --head: #0A0616; --head-ink: #F7F1FF;
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --spray: "Rubik Spray Paint", "Dela Gothic One", Impact, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: radial-gradient(1200px 600px at 80% -10%, #3A1660 0%, transparent 60%), radial-gradient(900px 500px at -10% 30%, #4A1A0C55 0%, transparent 60%), var(--bg); background-attachment: fixed; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head); }
.wrap { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- header ---------- */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--head); color: var(--head-ink); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.logo { display: inline-flex; align-items: baseline; gap: 6px; text-decoration: none; font-family: var(--display); font-size: 22px; letter-spacing: .01em; line-height: 1; white-space: nowrap; }
.logo .t { background: var(--sticker); color: #17181A; padding: 3px 6px 2px; transform: rotate(-2deg); display: inline-block; }
.logo .semi { color: var(--tag); }
nav.main { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
nav.main::-webkit-scrollbar { display: none; }
nav.main a { text-decoration: none; padding: 7px 11px; font-weight: 600; font-size: 14.5px; border-radius: 999px; white-space: nowrap; opacity: .82; }
nav.main a:hover { opacity: 1; }
nav.main a[aria-current="page"] { background: var(--head-ink); color: var(--head); opacity: 1; }
.me { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
#xp { display: flex; align-items: center; gap: 8px; }
.xp { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; opacity: .9; }
.xp b { color: var(--sticker); }
@media (max-width: 720px) { nav.main { order: 3; width: 100%; margin-left: 0; } .me { margin-left: auto; } }

main { padding-block: 22px 70px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 64ch; font-size: 17px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 999px; border: 2px solid var(--ink); background: var(--panel); font-weight: 700; cursor: pointer; text-decoration: none; line-height: 1.1; }
.btn:hover { background: var(--kraft-soft); }
.btn.primary { background: var(--tag); border-color: var(--tag); color: var(--tag-ink); }
.btn.primary:hover { filter: brightness(1.06); background: var(--tag); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pill { display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.pill.real { color: var(--ok); }
.pill.sim { color: var(--tag); }
.block { margin-top: 38px; }
.block > h2 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.05; margin-bottom: 6px; }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: end; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; } }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 7vw, 76px); line-height: .92; letter-spacing: -.01em; }
.hero h1 .semi { color: var(--tag); }
.hero h1 .t { background: var(--sticker); color: #17181A; padding: 0 .12em; display: inline-block; transform: rotate(-2deg); }
.hero .lede { margin-top: 14px; }
.hero .row { margin-top: 18px; }
.queryhint { background: var(--term); color: var(--term-ink); border-radius: 14px; padding: 16px 18px; font-family: var(--mono); font-size: 14px; line-height: 1.7; min-width: 0; overflow-x: auto; }
.queryhint .k { color: #FF9A66; } .queryhint .s { color: #9FE0B5; } .queryhint .c { color: var(--term-dim); }

/* ---------- drops carousel ---------- */
.drops-head { display: flex; justify-content: space-between; align-items: end; gap: 14px; flex-wrap: wrap; }
.fresh { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 8px; font-size: 14px; color: var(--muted); }
.fresh b { color: var(--ink); }
.fresh .live { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ok); }
.fresh .live i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.carousel { position: relative; margin-top: 14px; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 280px); gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 16px; scrollbar-width: thin; scroll-behavior: smooth; }
.cnav { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--ink); background: var(--panel); font-size: 18px; font-weight: 800; cursor: pointer; display: grid; place-items: center; }
.cnav:hover { background: var(--kraft-soft); }
.box { scroll-snap-align: start; background: var(--kraft); color: var(--kraft-ink); border-radius: 6px; padding: 10px; display: grid; gap: 8px; min-width: 0; position: relative; }
.box .lab { background: var(--panel); color: var(--ink); border-radius: 3px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.box .stamp { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.box .date { font-family: var(--display); font-size: 17px; line-height: 1; }
.box .when { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; background: var(--tag); color: var(--tag-ink); padding: 3px 7px; border-radius: 3px; white-space: nowrap; }
.box .when.later { background: var(--ink); color: var(--panel); }
.box .art { background: var(--kraft-soft); border-radius: 3px; display: grid; place-items: center; height: 118px; }
.box .art svg { width: 86%; height: auto; max-height: 110px; }
.box .brand { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.box .name { font-weight: 800; font-size: 15.5px; line-height: 1.25; min-height: 2.5em; overflow-wrap: anywhere; }
.box .cw { font-size: 13px; color: var(--muted); line-height: 1.35; overflow-wrap: anywhere; }
.box .foot { display: flex; justify-content: space-between; align-items: end; gap: 8px; border-top: 1.5px dashed var(--line); padding-top: 7px; }
.box .price { font-family: var(--display); font-size: 20px; line-height: 1; }
.box .price.tba { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--muted); }
.box .code { font-family: var(--mono); font-size: 11px; text-align: right; color: var(--muted); }
.box .bars { height: 16px; width: 92px; margin-left: auto; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 3px, var(--ink) 3px 4px, transparent 4px 7px, var(--ink) 7px 10px, transparent 10px 11px); opacity: .85; }
.box .ask { justify-self: start; background: transparent; border: 0; padding: 2px 0; font-weight: 700; font-size: 13.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; color: var(--kraft-ink); }
.empty { padding: 24px; border: 2px dashed var(--line); border-radius: 12px; color: var(--muted); }

/* ---------- missions shelf ---------- */
.shelf { display: grid; gap: 22px; margin-top: 14px; }
.phase h3 { font-family: var(--display); font-weight: 400; font-size: 20px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.phase h3 small { font-family: var(--body); font-size: 14px; color: var(--muted); font-weight: 500; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
.tile { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; min-width: 0; }
.tile:hover:not(:disabled) { border-color: var(--ink); }
.tile .n { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.tile .tt { font-weight: 800; line-height: 1.25; }
.tile.done { border-color: var(--ok); }
.tile.done .n b { color: var(--ok); }
.tile.next { border-color: var(--tag); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tag) 25%, transparent); }
.tile:disabled { cursor: not-allowed; opacity: .55; }

/* ---------- mission ---------- */
.mhead { display: grid; gap: 6px; }
.mhead h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 5vw, 46px); line-height: 1; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 22px; margin-top: 18px; align-items: start; }
@media (max-width: 900px) { .mgrid { grid-template-columns: 1fr; } }
.say { font-size: 18px; max-width: 66ch; }
.an { margin-top: 14px; background: var(--sticker); color: #17181A; border-radius: 10px; padding: 12px 14px; transform: rotate(-.4deg); max-width: 66ch; }
.an b { font-family: var(--mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; display: block; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card h3 { font-size: 13px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.challenge { border-color: var(--ink); }
.challenge .q { font-weight: 700; font-size: 17px; }
.side { display: grid; gap: 14px; }
.side .card p { font-size: 14.5px; }
.schema { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }
.schema b { font-family: var(--body); font-size: 14px; }
.schema .col { color: var(--muted); }

/* editor + results ("register screen") */
.term { background: var(--term); color: var(--term-ink); border-radius: 12px; overflow: hidden; min-width: 0; }
.term-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--term-line); font-family: var(--mono); font-size: 12px; color: var(--term-dim); flex-wrap: wrap; }
textarea.sql { display: block; width: 100%; min-height: 120px; resize: vertical; background: transparent; color: var(--term-ink); border: 0; padding: 12px 14px; font-family: var(--mono); font-size: 14px; line-height: 1.6; tab-size: 2; white-space: pre; overflow-x: auto; }
textarea.sql:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--tag); }
.term-f { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px 12px; }
.term .btn { border-color: var(--term-line); background: #23262B; color: var(--term-ink); }
.term .btn:hover { background: #2D3137; }
.term .btn.primary { background: var(--tag); border-color: var(--tag); color: #fff; }
.kbd { font-family: var(--mono); font-size: 11.5px; color: var(--term-dim); }
.out { margin-top: 10px; display: grid; gap: 10px; min-width: 0; }
.msg { padding: 10px 12px; border-radius: 10px; font-size: 15px; }
.msg.err { background: var(--bad-soft); color: var(--bad); font-family: var(--mono); font-size: 13.5px; overflow-wrap: anywhere; }
.msg.ok { background: var(--ok-soft); color: var(--ok); font-weight: 700; }
.msg.info { background: var(--kraft-soft); color: var(--kraft-ink); }
.tablewrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 10px; max-height: 420px; background: var(--panel); }
table.res { border-collapse: collapse; width: 100%; font-size: 14px; }
table.res th { position: sticky; top: 0; background: var(--panel); text-align: left; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--ink); white-space: nowrap; }
table.res td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; max-width: 360px; }
table.res td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 13px; white-space: nowrap; }
table.res .null { font-family: var(--mono); font-size: 11px; color: var(--muted); border: 1px dashed var(--line); padding: 0 4px; border-radius: 4px; }
.rescount { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.chart { border: 2px solid var(--line); border-radius: 10px; background: var(--panel); padding: 10px; overflow-x: auto; }
.chart svg { display: block; min-width: 420px; width: 100%; height: auto; }
.chart text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.chart .barr { fill: var(--tag); }
.chart .axis { stroke: var(--line); }
details.py { border: 2px dashed var(--line); border-radius: 12px; padding: 10px 14px; }
details.py summary { cursor: pointer; font-weight: 700; }
details.py pre { margin: 10px 0 0; background: var(--term); color: var(--term-ink); padding: 12px; border-radius: 10px; font-family: var(--mono); font-size: 13px; overflow-x: auto; }
.hints { display: grid; gap: 6px; }
.hint { background: var(--kraft-soft); color: var(--kraft-ink); border-radius: 8px; padding: 8px 10px; font-size: 14.5px; }
.hint code, .say code, .lede code, p code, li code { font-family: var(--mono); font-size: .9em; background: var(--kraft-soft); color: var(--kraft-ink); padding: 1px 5px; border-radius: 4px; }

/* quiz */
.qz { display: grid; gap: 14px; }
.qz .item { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.qz .item.right { border-color: var(--ok); }
.qz .opts { display: grid; gap: 8px; }
.qz .opt { text-align: left; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 600; }
.qz .opt:hover:not(:disabled) { border-color: var(--ink); }
.qz .opt.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.qz .opt.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
.qz .why { font-size: 14.5px; color: var(--muted); }

/* AI */
.ai { display: grid; gap: 8px; }
.ai-in { width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); }
.ai-out { background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.ai-out code { font-family: var(--mono); }
.ai-note { font-size: 13px; color: var(--muted); }

/* data page */
.dtable { width: 100%; border-collapse: collapse; font-size: 15px; }
.dtable th { text-align: left; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px 8px 0; border-bottom: 2px solid var(--ink); }
.dtable td { padding: 10px 10px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.steps { display: grid; gap: 10px; counter-reset: s; padding: 0; list-style: none; margin: 10px 0 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
.steps li::before { content: counter(s); font-family: var(--display); font-size: 18px; width: 34px; height: 34px; display: grid; place-items: center; background: var(--sticker); color: #17181A; border-radius: 50%; }


/* ---------- rank badge + ladder ---------- */
.rankchip { display: flex; align-items: center; gap: 8px; text-decoration: none; padding: 3px 10px 3px 4px; border-radius: 999px; border: 1.5px solid #ffffff33; }
.rankchip:hover { border-color: var(--sticker); }
.rankchip svg.mini { width: 46px; height: auto; }
.rc-t { display: grid; gap: 2px; line-height: 1.1; }
.rc-t b { font-size: 13px; font-weight: 800; color: var(--head-ink); }
.rc-t small { font-family: var(--mono); font-size: 10.5px; opacity: .8; }
.rbar { display: block; width: 110px; height: 5px; border-radius: 9px; background: #ffffff2a; overflow: hidden; }
.rbar i { display: block; height: 100%; background: var(--sticker); border-radius: 9px; }
.rbar.big { width: min(320px, 100%); height: 10px; background: var(--line); margin-top: 8px; }
.rbar.big i { background: var(--tag); }
@media (max-width: 520px) { .rc-t small { display: none; } .rbar { width: 70px; } }
.ladder { list-style: none; padding: 0; margin: 20px 0; display: grid; gap: 12px; }
.rung { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.rung h3 { font-family: var(--display); font-weight: 400; font-size: 24px; }
.rung-art { background: var(--kraft-soft); border-radius: 10px; padding: 8px; }
.rung-art svg { width: 100%; height: auto; display: block; }
.rung:not(.got) .rung-art svg { filter: grayscale(1) brightness(.35); opacity: .45; }
.rung.cur { border-color: var(--tag); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tag) 25%, transparent); }
@media (max-width: 520px) { .rung { grid-template-columns: 96px 1fr; } }

/* ---------- banner carousel ---------- */
.banner { position: relative; background: var(--head); color: var(--head-ink); border-radius: 18px; overflow: hidden; }
.slides { display: grid; }
.slide { grid-area: 1 / 1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 10px; align-items: center; padding: 26px 28px 70px; opacity: 0; visibility: hidden; transition: opacity .5s; background: radial-gradient(120% 140% at 15% 40%, color-mix(in srgb, var(--a) 55%, transparent), transparent 60%), radial-gradient(90% 120% at 90% 100%, color-mix(in srgb, var(--b) 30%, transparent), transparent 70%); }
.slide.on { opacity: 1; visibility: visible; }
.slide-art { position: relative; display: grid; place-items: center; min-height: 220px; text-decoration: none; border-radius: 14px; }
.slide-art svg.big { width: 100%; max-width: 460px; height: auto; filter: drop-shadow(0 18px 18px #0007); transform: rotate(-8deg); transition: transform .3s; }
.slide-art:hover svg.big { transform: rotate(-4deg) scale(1.03); }
.slide-art img { max-width: 100%; max-height: 300px; object-fit: contain; border-radius: 10px; }
.art-cap { position: absolute; bottom: 6px; left: 8px; font-family: var(--mono); font-size: 11.5px; background: #000a; color: #fff; padding: 3px 8px; border-radius: 999px; }
.art-cap:empty { display: none; }
.slide-art.solo { background: var(--term); min-height: 260px; padding: 16px; }
.slide-copy { display: grid; gap: 8px; min-width: 0; }
.slide-stamp { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; }
.slide-stamp .when, .box .when { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; background: var(--tag); color: var(--tag-ink); padding: 3px 7px; border-radius: 3px; white-space: nowrap; }
.slide-stamp .when.later { background: var(--sticker); color: #17181A; }
.slide-brand { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.slide-nick { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 6vw, 64px); line-height: .95; overflow-wrap: anywhere; }
.slide-name { font-weight: 700; font-size: 17px; }
.slide-cw { opacity: .8; font-size: 14.5px; }
.slide-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 6px; }
.slide-price { font-family: var(--display); font-size: 30px; color: var(--sticker); margin-right: 6px; }
.banner .btn:not(.primary) { background: transparent; color: var(--head-ink); border-color: var(--head-ink); }
.banner .btn:not(.primary):hover { background: #ffffff1a; }
.bctl { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; gap: 10px; align-items: center; justify-content: center; }

/* ---------- pop-up screens ---------- */
dialog.pop { border: 0; border-radius: 22px; padding: 0; background: var(--panel); color: var(--ink); width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: auto; box-shadow: 0 30px 80px #0008; }

td.pos { color: var(--ok); } td.neg { color: var(--bad); }

/* city colors + motion */
.city .sk1 { stop-color: #FFB27A; } .city .sk2 { stop-color: #FFE3B0; }

/* =========== LEARN LAYOUT (horizontal, calmer, Duolingo-style path) =========== */
.wrap { max-width: 1240px; }
.bar { flex-wrap: nowrap; gap: 18px; padding-block: 12px; }

.me { flex: none; }

@media (max-width: 760px) { .bar { flex-wrap: wrap; } nav.main { order: 3; width: 100%; justify-content: flex-start; } }
main { padding-block: 34px 90px; }
.chip-k { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--sticker); background: #F9D30614; border: 1px solid #F9D30655; padding: 5px 10px; border-radius: 999px; }
.sec-h { display: grid; gap: 10px; margin-bottom: 22px; justify-items: start; }
.lh-art { overflow: visible; } .lhero { overflow-x: clip; }
.sec-h h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 3.2vw, 38px); line-height: 1.05; }
.row-h { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }

.block { margin-top: 76px; }
/* 3D buttons */
.btn.big3d { font-size: 17px; padding: 14px 24px; border-radius: 16px; border-width: 2px; box-shadow: 0 5px 0 #A33A07; transform: translateY(0); transition: transform .08s, box-shadow .08s; }

.btn.ghost3d:active { box-shadow: 0 1px 0 #08040F; }
/* hero */
.lhero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; min-height: 520px; }
.lh-copy { display: grid; gap: 18px; justify-items: start; }

.lh-copy h1 .semi { color: var(--tag); }

.lh-copy .lede b { color: var(--ink); }

.lh-art { position: relative; aspect-ratio: 1 / .92; max-width: 100%; }
.lh-frame { position: absolute; inset: 8% 0 0 8%; border-radius: 28px; overflow: hidden; border: 3px solid var(--line); box-shadow: 14px 14px 0 var(--tag); }
.lh-frame img { width: 100%; height: 100%; object-fit: cover; }
.lh-art img.lh-hero { position: absolute; left: -2%; bottom: -4%; height: 92%; width: auto; max-width: 80%; object-fit: contain; object-position: left bottom; z-index: 2; animation: bobm 4s ease-in-out infinite; }
.float-card { position: absolute; z-index: 3; display: flex; gap: 10px; align-items: center; background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; box-shadow: 0 10px 24px #0008; font-size: 13.5px; }
.float-card img { width: 40px; height: 40px; border-radius: 50%; background: var(--purple); }

.fc1 { top: 2%; right: 4%; animation: bobm 5s ease-in-out infinite; }

@media (max-width: 900px) { .lhero { grid-template-columns: minmax(0, 1fr); } .lh-art { max-width: 520px; width: 100%; justify-self: center; } }
/* stats */

.stats > div { padding: 20px 22px; display: grid; gap: 4px; border-left: 2px solid var(--line); }
.stats > div:first-child { border-left: 0; }
.stats b { font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1; color: var(--sticker); }

@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats > div:nth-child(3) { border-left: 0; } .stats > div:nth-child(n+3) { border-top: 2px solid var(--line); } }
/* steps */
.steps4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.steps4 > div { position: relative; background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 22px; display: grid; gap: 10px; align-content: start; }
.steps4 img { width: 56px; height: 56px; border-radius: 50%; background: var(--purple); object-fit: cover; }

@media (max-width: 900px) { .steps4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .steps4 { grid-template-columns: minmax(0, 1fr); } }
/* units */
.path-prog { display: grid; gap: 6px; min-width: 220px; font-size: 14px; color: var(--muted); }
.units { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.unit { text-decoration: none; background: var(--panel); border: 2px solid var(--line); border-radius: 20px; overflow: hidden; display: grid; transition: transform .15s, border-color .15s; }
.unit:hover { transform: translateY(-3px); border-color: var(--ink); }
.unit.cur { border-color: var(--tag); box-shadow: 0 0 0 4px #F4560C33; }
.u-art { aspect-ratio: 16 / 9; overflow: hidden; } .u-art img { width: 100%; height: 100%; object-fit: cover; }
.u-body { padding: 14px; display: grid; gap: 8px; }
.u-k { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.unit h3, .unit-ban h3 { font-size: 18px; font-weight: 800; line-height: 1.2; }
.u-n { font-size: 13px; color: var(--muted); }
@media (max-width: 1000px) { .units { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: minmax(220px, 1fr); overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; } .unit { scroll-snap-align: start; } }
.unit-path { margin-top: 26px; }
/* Duolingo-style path */
.path { display: flex; gap: 0; overflow-x: auto; padding: 26px 6px 10px; scroll-snap-type: x proximity; }
.node { position: relative; flex: 0 0 150px; display: grid; justify-items: center; gap: 8px; background: none; border: 0; cursor: pointer; padding: 0 6px; text-align: center; scroll-snap-align: start; color: var(--ink); }
.node::before { content: ""; position: absolute; top: 34px; left: -50%; right: 50%; height: 6px; background: var(--line); z-index: 0; border-radius: 3px; }
.node:first-child::before { display: none; }
.node.done::before, .node.next::before { background: var(--ok); }
.node .dot { position: relative; z-index: 1; width: 72px; height: 68px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 20px; background: #2B1C46; color: var(--muted); box-shadow: 0 6px 0 #0B0618; transition: transform .1s; }
.node:nth-child(even) .dot { margin-top: 14px; }
